name: Import NGCP hourly-demand dataset

on:
  push:
    paths:
      - ".github/workflows/import-ngcp-dataset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download official NGCP workbook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw
          curl --fail --location --retry 5 --retry-delay 3             "https://www.ngcp.ph/Attachment-Uploads/operations/Hourly%20Demand%20per%20Grid.xlsx"             --output "data/raw/Hourly Demand per Grid.xlsx"

      - name: Verify workbook matches uploaded dataset
        shell: bash
        run: |
          set -euo pipefail
          echo "c7b22f60df84a00065d73217a946e222236a5fc1a3fb5adfac319517926f199b  data/raw/Hourly Demand per Grid.xlsx" | sha256sum --check -
          test "$(stat -c %s "data/raw/Hourly Demand per Grid.xlsx")" -eq 6429509

      - name: Commit dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "data/raw/Hourly Demand per Grid.xlsx"
          if git diff --cached --quiet; then
            echo "Dataset already committed."
            exit 0
          fi
          git commit -m "Add official NGCP hourly demand dataset"
          git push
